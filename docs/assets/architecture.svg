<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Docktrine architecture</title>
  <desc id="d">The CLI pushes images to a registry and calls the gateway. The gateway reaches each node over SSH and proxies visitors to the node's ingress, which routes to app containers.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8e6522"/>
    </marker>
  </defs>
  <rect width="860" height="420" rx="16" fill="#fbf7ef"/>

  <!-- boxes -->
  <g stroke="#c99a45" stroke-width="2" fill="#fff">
    <rect x="30" y="50" width="220" height="90" rx="12"/>
    <rect x="30" y="270" width="220" height="90" rx="12"/>
    <rect x="360" y="50" width="240" height="120" rx="12"/>
    <rect x="360" y="270" width="240" height="120" rx="12"/>
    <rect x="660" y="50" width="170" height="90" rx="12"/>
  </g>
  <g fill="#2a231c" text-anchor="middle">
    <text x="140" y="88" font-size="18" font-weight="700">Your machine / CI</text>
    <text x="140" y="112" font-size="14" fill="#6b5a3e">docktrine CLI · docker buildx</text>

    <text x="140" y="308" font-size="18" font-weight="700">Registry</text>
    <text x="140" y="332" font-size="14" fill="#6b5a3e">images for every node</text>

    <text x="480" y="82" font-size="18" font-weight="700">Gateway</text>
    <text x="480" y="108" font-size="14" fill="#6b5a3e">Docktrine API + UI</text>
    <text x="480" y="130" font-size="14" fill="#6b5a3e">Nginx Proxy Manager</text>

    <text x="480" y="302" font-size="18" font-weight="700">Node</text>
    <text x="480" y="328" font-size="14" fill="#6b5a3e">Docker + Traefik ingress</text>
    <text x="480" y="350" font-size="14" fill="#6b5a3e">routes by hostname</text>
    <text x="480" y="372" font-size="14" fill="#6b5a3e">to app containers</text>

    <text x="745" y="88" font-size="18" font-weight="700">Visitors</text>
    <text x="745" y="112" font-size="14" fill="#6b5a3e">app.example.com</text>
  </g>

  <!-- arrows -->
  <g stroke="#8e6522" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M250 95H360"/>
    <path d="M660 95H600"/>
    <path d="M140 140V270"/>
    <path d="M250 315H360"/>
    <path d="M480 170V270"/>
  </g>
  <g fill="#5e4314" font-size="13" text-anchor="middle">
    <text x="305" y="84" font-size="12">HTTPS + API key</text>
    <text x="630" y="84">HTTPS</text>
    <text x="150" y="210" text-anchor="start">push</text>
    <text x="305" y="305">pull</text>
    <text x="492" y="212" text-anchor="start">SSH + proxy</text>
    <text x="492" y="228" text-anchor="start">hosts</text>
  </g>
</svg>
