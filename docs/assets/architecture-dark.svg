<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Docktrine architecture</title>
  <desc id="d">The CLI pushes images to a registry and calls the Docktrine server on the gateway. Docktrine deploys to each node over SSH, and Nginx Proxy Manager forwards visitors to the node's ingress, which routes to app containers.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c99a45"/>
    </marker>
  </defs>
  <rect width="860" height="420" rx="16" fill="#1b1714"/>

  <!-- boxes -->
  <g stroke="#c99a45" stroke-width="2" fill="#241f1b">
    <rect x="30" y="50" width="220" height="90" rx="12"/>
    <rect x="30" y="270" width="220" height="90" rx="12"/>
    <rect x="360" y="50" width="240" height="120" rx="12"/>
    <rect x="360" y="270" width="240" height="120" rx="12"/>
    <rect x="660" y="50" width="170" height="90" rx="12"/>
  </g>
  <g fill="#ece3d1" text-anchor="middle">
    <text x="140" y="88" font-size="18" font-weight="700">Your machine / CI</text>
    <text x="140" y="112" font-size="14" fill="#a89c88">docktrine CLI · docker buildx</text>

    <text x="140" y="308" font-size="18" font-weight="700">Registry</text>
    <text x="140" y="332" font-size="14" fill="#a89c88">images for every node</text>

    <text x="480" y="82" font-size="18" font-weight="700">Gateway</text>
    <text x="480" y="108" font-size="14" fill="#a89c88">Docktrine API + UI</text>
    <text x="480" y="130" font-size="14" fill="#a89c88">Nginx Proxy Manager</text>

    <text x="480" y="302" font-size="18" font-weight="700">Node</text>
    <text x="480" y="328" font-size="14" fill="#a89c88">Docker + Traefik ingress</text>
    <text x="480" y="350" font-size="14" fill="#a89c88">routes by hostname</text>
    <text x="480" y="372" font-size="14" fill="#a89c88">to app containers</text>

    <text x="745" y="88" font-size="18" font-weight="700">Visitors</text>
    <text x="745" y="112" font-size="14" fill="#a89c88">app.example.com</text>
  </g>

  <!-- arrows -->
  <g stroke="#c99a45" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M250 95H360"/>
    <path d="M660 95H600"/>
    <path d="M140 140V270"/>
    <path d="M250 315H360"/>
    <path d="M420 170V270"/>
    <path d="M540 170V270"/>
  </g>
  <g fill="#dcb768" font-size="13" text-anchor="middle">
    <text x="305" y="84" font-size="12">HTTPS + API key</text>
    <text x="630" y="84">HTTPS</text>
    <text x="150" y="210" text-anchor="start">push</text>
    <text x="305" y="305">pull</text>
    <text x="430" y="217" text-anchor="start">SSH: deploys</text>
    <text x="550" y="217" text-anchor="start">HTTP: traffic</text>
  </g>
</svg>
